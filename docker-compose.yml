networks:
  toubilib.net:
    driver: bridge

services:
  # service api.toubeelib : api pour la prise de rdv
  #
  api.toubilib:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6080:80'
    volumes:
      - ./app:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiprati.db
      - toubiauth.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  api.praticiens:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6082:80'
    volumes:
      - ./app-praticiens:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiprati.db
      - rabbitmq
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  api.rdv:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6083:80'
    volumes:
      - ./app-rdv:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubirdv.db
      - rabbitmq
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - '15672:15672'
      - '5672:5672'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 8s
      timeout: 30s
      retries: 3
    networks:
      - toubilib.net
    volumes:
      - ./rabbitmq.toubi:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: toubi
      RABBITMQ_DEFAULT_PASS: toubi

    
  mail.toubi:
    build:
      context: .
      dockerfile: mailcatcher.Dockerfile
    networks:
      - toubilib.net
    ports:
      - '1080:1080' 

  auth:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6084:80'
    volumes:
      - ./app-auth:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiauth.db
      - rabbitmq
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # service gateway : point d'entrée pour les clients
  gateway:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6081:80'
    volumes:
      - ./gateway:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - rabbitmq
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

    # service toubiprat.db : base de données postgresql pour les praticiens

  toubiprati.db:
    image: 'postgres:latest'
    env_file: ./toubipratdb.env
    ports:
      - '5432:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/toubiprat.schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sql/toubiprat.data.sql:/docker-entrypoint-initdb.d/2-data.sql

    
    

  toubiauth.db:
    image: 'postgres:latest'
    env_file: ./toubiauthdb.env
    ports:
      - '5436:5436'
    networks:
      - toubilib.net
    volumes:
      - ./sql/toubiauth.schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sql/toubiauth.data.sql:/docker-entrypoint-initdb.d/2-data.sql


  toubirdv.db:
    image: 'postgres:latest'
    env_file: ./toubirdvdb.env
    ports:
      - '5433:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/toubirdv.schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sql/toubirdv.data.sql:/docker-entrypoint-initdb.d/2-data.sql

  toubipat.db:
    image: 'postgres:latest'
    env_file: ./toubipatientdb.env
    ports:
      - '5434:5431'
    networks:
      - toubilib.net
    volumes:
      - ./sql/toubipat.schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sql/toubipat.data.sql:/docker-entrypoint-initdb.d/2-data.sql


  #
  # service administration des bases sql
  #
  adminer:
    image: adminer
    ports:
      - '8080:8080'
    networks:
      - toubilib.net

  mailer:
    build:
      context: app-mailer
      dockerfile: Dockerfile
    volumes:
      - ./app-mailer:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    environment:
      - APP_ENV=dev
      - SMTP_HOST=mail.toubi
      - SMTP_PORT=1025
    depends_on:
      - rabbitmq
      - mail.toubi
    command: sh -c "composer install && tail -f /dev/null"
